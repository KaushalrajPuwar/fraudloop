apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: logging
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }

    filter {
      mutate {
        add_field => { "pipeline" => "fraudloop" }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "fraudloop-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.15.3
          args: ["-w", "1"]
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            # Logstash ships a monitoring pipeline by default; it is not needed
            # here and costs a second JVM's worth of threads and buffers.
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          ports:
            - name: tcp
              containerPort: 5000
          resources:
            # A 192m heap plus JVM overhead measured at ~503Mi, which is right
            # at a 512Mi limit - the container was OOMKilled repeatedly.
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  selector:
    app: logstash
  ports:
    - name: tcp
      port: 5000
      targetPort: tcp

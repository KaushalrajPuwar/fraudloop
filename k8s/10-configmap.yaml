apiVersion: v1
kind: ConfigMap
metadata:
  name: scorer-config
  namespace: fraudloop
  labels:
    app.kubernetes.io/name: scorer
data:
  LOG_LEVEL: "INFO"
  FRAUD_THRESHOLD: "0.5"
  STATS_WINDOW: "500"
  RECENT_WINDOW: "20"
  LOGSTASH_HOST: "logstash.logging.svc.cluster.local"
  LOGSTASH_PORT: "5000"
  VAULT_SECRET_PATH: "secret/data/fraudloop/api-key"
